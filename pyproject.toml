[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waveegg-a2e"
version = "0.1.0"
description = "Archived Trial22 WaveEGG weights and differentiable EGG-space auxiliary loss"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<3", "torchaudio>=2.6,<3", "scipy>=1.11", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["waveegg*"]

[tool.setuptools.package-data]
waveegg = ["config.json", "weights/*.pt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
